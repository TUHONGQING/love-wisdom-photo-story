<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="传承爱与正见：在一幅水墨画里，遇见九段心语与同行的照片。">
<title>传承爱与正见 · 水墨相册</title>
<style>
@font-face{font-family:"Ma Shan Zheng";src:url("assets/MaShanZheng-Regular.ttf") format("truetype");font-display:swap}
:root{--paper:#ffffff;--ink:#1a1a1a;--cinnabar:#9e2b25;--slow:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;-webkit-font-smoothing:antialiased}
button{font:inherit}button:focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px}.spot:focus-visible{outline:none}[hidden]{display:none!important}
#home{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper)}
#stage{position:relative;aspect-ratio:1536/1024;width:min(100vw,calc(100vh * 1.5));max-height:100vh;background:var(--paper) url("assets/painting4.jpg") center/100% 100% no-repeat}
#title{position:absolute;top:10%;left:27%;margin:0;writing-mode:vertical-rl;white-space:nowrap;font-family:"Ma Shan Zheng","STXingkai","KaiTi",serif;font-size:clamp(1.1rem,2.6vmin,2rem);font-weight:400;letter-spacing:.4em;line-height:1.65;text-shadow:0 0 6px #ffffffeb;opacity:0;pointer-events:none}
#title small{display:block;font-size:.6em;letter-spacing:.35em;margin-top:1.6em;opacity:.65}
body.intro-started #title{animation:title-appear 2s var(--slow) 3.6s both}
body.skip-intro #title{animation:none;opacity:.9}
@keyframes title-appear{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:.9;filter:blur(0);transform:translateY(0)}}
.spot{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.spot .bloom{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#1a1a1a66 0%,#1a1a1a26 45%,#1a1a1a00 70%);opacity:0;transform:scale(.7);transition:opacity .8s var(--slow),transform .8s var(--slow);pointer-events:none}
.spot:hover .bloom,.spot:focus-visible .bloom{opacity:1;transform:scale(1)}
#entry{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:var(--paper)}
#enter{position:relative;width:86px;height:86px;border:0;padding:0;background:none;cursor:pointer;transform:rotate(-3deg);transition:transform .8s var(--slow)}#enter:hover{transform:rotate(-3deg) scale(.93)}#enter img{display:block;width:100%;height:100%}#enter span{position:absolute;inset:0;display:grid;place-items:center;writing-mode:vertical-rl;color:var(--paper);font-family:"Ma Shan Zheng","STXingkai","KaiTi",serif;font-size:1.12rem;letter-spacing:.1em}
#opening{position:fixed;inset:0;z-index:100;width:100%;height:100%;object-fit:cover;background:var(--paper);pointer-events:none;opacity:1;visibility:hidden;filter:blur(0);transform:scale(1);transition:opacity 3s var(--slow),filter 3s var(--slow),transform 3s var(--slow)}
#opening.playing{visibility:visible}#opening.fading{opacity:0;filter:blur(10px);transform:scale(1.03)}
#mute{position:fixed;right:18px;bottom:18px;z-index:60;width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer;opacity:.6;transition:opacity .8s var(--slow)}#mute:hover,#mute:focus-visible{opacity:1}#mute img{display:block;width:100%;height:100%}#mute span{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);font-family:"Ma Shan Zheng","STXingkai","KaiTi",serif;font-size:.8rem}
#inkveil{position:fixed;z-index:50;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#1a1a1afb 0%,#1a1a1aec 56%,#1a1a1a00 73%);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;filter:blur(2px)}
#theme{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.2vh,22px);padding:4vh 5vw;background:radial-gradient(ellipse 40% 30% at 0 0,#1a1a1a12,transparent 70%),radial-gradient(ellipse 40% 30% at 100% 0,#1a1a1a0f,transparent 70%),radial-gradient(ellipse 45% 35% at 0 100%,#1a1a1a0f,transparent 70%),radial-gradient(ellipse 45% 35% at 100% 100%,#1a1a1a14,transparent 70%),var(--paper);opacity:0;visibility:hidden;transition:opacity .8s var(--slow),visibility .8s}
#theme.show{opacity:1;visibility:visible}
.theme-art{position:absolute;z-index:0;width:clamp(160px,27vw,350px);height:min(72vh,650px);background:var(--theme-art) center/contain no-repeat;pointer-events:none;opacity:.42;transition:opacity 1.4s var(--slow) .5s}
.theme-art-left{left:max(-2vw,calc(50% - 620px));top:14%}
.theme-art-right{right:max(-2vw,calc(50% - 620px));top:14%;transform:scaleX(-1) rotate(4deg);opacity:.26}
#theme:not(.show) .theme-art{opacity:0}
#theme>*:not(.theme-art){position:relative;z-index:1}
#theme-photo{display:block;width:min(72vw,640px);height:min(56vh,480px);object-fit:contain;padding:10px;border:1px solid #1a1a1a26;background:var(--paper);box-shadow:0 8px 40px #1a1a1a1f;opacity:0;transform:scale(.96);transition:opacity 1.2s var(--slow) .7s,transform 1.2s var(--slow) .7s}
#theme.show #theme-photo{opacity:1;transform:scale(1)}#theme.show #theme-photo.switching{opacity:0;transition:opacity .48s var(--slow)}
#theme-caption{max-width:900px;margin:0;text-align:center;font-family:"Ma Shan Zheng","STXingkai","Kaiti SC","KaiTi",serif;font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.7;letter-spacing:.12em;opacity:0;filter:blur(6px);transition:opacity 1.4s var(--slow) 1s,filter 1.4s var(--slow) 1s}
#theme.show #theme-caption{opacity:.9;filter:blur(0)}
#stroke{display:block;width:min(38vw,320px);max-height:18px;object-fit:contain;opacity:0;transition:opacity 1.2s var(--slow) 1.15s}#theme.show #stroke{opacity:.85}
#photo-controls{display:flex;align-items:center;justify-content:center;gap:28px;min-height:38px;opacity:0;transition:opacity 1s var(--slow) 1.1s}#theme.show #photo-controls{opacity:1}
#photo-controls button{width:44px;height:36px;padding:0;border:0;background:transparent;color:var(--ink);font-size:30px;line-height:1;cursor:pointer}#photo-controls button:disabled{opacity:.25;cursor:default}
#back{position:relative;width:76px;height:76px;padding:0;border:0;background:none;color:var(--paper);cursor:pointer;opacity:0;transform:rotate(-3deg);transition:opacity 1s var(--slow) 1.3s,transform .8s var(--slow),filter .8s var(--slow)}#theme.show #back{opacity:1}#back:hover{transform:rotate(-3deg) scale(.93);filter:brightness(1.08)}
#back img{display:block;width:100%;height:100%;object-fit:contain}#back span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:"Ma Shan Zheng","STXingkai","Kaiti SC","KaiTi",serif;font-size:1.12rem;letter-spacing:.12em;text-shadow:0 1px 2px #1a1a1a4d}
@media(max-width:600px){#theme{padding:3vh 5vw;gap:10px}#theme-photo{width:84vw;height:44vh;padding:7px}#theme-caption{font-size:clamp(1.3rem,4.8vw,1.65rem);line-height:1.7;letter-spacing:.06em}.theme-art{width:32vw;height:58vh;opacity:.34}.theme-art-left{left:-3vw;top:11%}.theme-art-right{right:-3vw;top:11%;opacity:.22}#back{width:62px;height:62px}#stroke{width:min(56vw,230px)}}
@media(prefers-reduced-motion:reduce){#opening{display:none}*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<section id="home" aria-label="水墨画中的九个主题"><div id="stage"><h1 id="title">传承爱与正见<small>生命更有品质</small></h1></div></section>
<div id="entry"><button id="enter" type="button" aria-label="轻触入卷"><img src="assets/seal-small.png" alt=""><span>入卷</span></button></div>
<video id="opening" muted playsinline webkit-playsinline preload="auto" aria-hidden="true"><source src="assets/ink-opening-silent.mp4" type="video/mp4"></video>
<audio id="bgm" src="assets/bgm/bgm-qinghuaci-small.m4a" preload="none" loop></audio>
<button id="mute" type="button" aria-label="暂停背景音乐" aria-pressed="true" hidden><img src="assets/seal-small.png" alt=""><span>静</span></button>
<div id="inkveil" aria-hidden="true"></div>
<section id="theme" role="dialog" aria-modal="true" aria-labelledby="theme-caption" aria-hidden="true"><div class="theme-art theme-art-left" aria-hidden="true"></div><div class="theme-art theme-art-right" aria-hidden="true"></div><img id="theme-photo" alt=""><div id="photo-controls" aria-label="切换照片"><button id="photo-prev" type="button" aria-label="上一张照片">‹</button><button id="photo-next" type="button" aria-label="下一张照片">›</button></div><p id="theme-caption"></p><img id="stroke" src="assets/brush-stroke.png" alt=""><button id="back" type="button" aria-label="返回"><img src="assets/seal-small.png" alt=""><span>返回</span></button></section>
<script>
const SPOTS=[
{name:'莲花',x:83,y:91,r:7,caption:'爱是慈悲，内心柔软，没有敌人',photo:'assets/photos/06.jpg',photos:[{src:'assets/photos/06.jpg',alt:'两位伙伴在花树前合影'},{src:'assets/photos/02.jpg',alt:'两位伙伴在树林前合影'}]},
{name:'石灯笼',x:64,y:77,r:6,caption:'正见是智慧，破除无明，减少烦恼',photo:'assets/photos/04.jpg',photos:[{src:'assets/photos/04.jpg',alt:'装裱的书法作品'},{src:'assets/photos/08.jpg',alt:'写有惜福二字的书法作品'}]},
{name:'竹林',x:5,y:38,r:11,caption:'传承爱与正见，是我们共同的要求',photo:'assets/photos/07.jpg',photos:[{src:'assets/photos/07.jpg',alt:'伙伴们在台阶上的合影'},{src:'assets/photos/09.jpg',alt:'伙伴们在树荫下的合影'}]},
{name:'石桥',x:48,y:79,r:10,caption:'为利有情愿成佛，先提升生命品质',photo:'assets/photos/05.jpg',photos:[{src:'assets/photos/05.jpg',alt:'两位伙伴在绿树前合影'}]},
{name:'孤舟',x:27,y:85,r:8,caption:'终极追求：创造美好回忆，提升生命品质',photo:'assets/photos/11.jpg',photos:[{src:'assets/photos/11.jpg',alt:'伙伴在上海城市景观前留影'},{src:'assets/photos/14.jpg',alt:'伙伴在上海江边留影'}]},
{name:'飞鸟',x:13,y:12,r:7,caption:'拍照留下美好，翻看享受当下',photo:'assets/photos/03.jpg',photos:[{src:'assets/photos/03.jpg',alt:'两位伙伴在海边自拍'},{src:'assets/photos/12.jpg',alt:'三位伙伴在树林前合影'}]},
{name:'松树',x:89,y:63,r:11,caption:'开心工作，享受当下；吃素健康，读书增慧',photo:'assets/photos/13.jpg',photos:[{src:'assets/photos/13.jpg',alt:'伙伴穿白色工作服的肖像'}]},
{name:'梅枝',x:10,y:67,r:12,caption:'先慈悲自己，把自己过好',photo:'assets/photos/10.jpg',photos:[{src:'assets/photos/10.jpg',alt:'伙伴在树下的单人照片'}]},
{name:'明月',x:88,y:10,r:8,caption:'照顾好自己，才能照顾家庭和伙伴',photo:'assets/photos/15.jpg',photos:[{src:'assets/photos/15.jpg',alt:'两位伙伴在树前合影'},{src:'assets/photos/16.jpg',alt:'两位伙伴在公园合影'}]}];
const stage=document.getElementById('stage'),entry=document.getElementById('entry'),opening=document.getElementById('opening'),bgm=document.getElementById('bgm'),mute=document.getElementById('mute'),veil=document.getElementById('inkveil'),theme=document.getElementById('theme'),themePhoto=document.getElementById('theme-photo'),caption=document.getElementById('theme-caption'),controls=document.getElementById('photo-controls'),prev=document.getElementById('photo-prev'),next=document.getElementById('photo-next'),back=document.getElementById('back');
let activeSpot=null,activeButton=null,photoIndex=0,busy=false,switchTimer=0,photoSwitching=false;
SPOTS.forEach(spot=>{const button=document.createElement('button');button.type='button';button.className='spot';button.style.left=spot.x+'%';button.style.top=spot.y+'%';button.style.width=(spot.r*2)+'%';button.setAttribute('aria-label',spot.name+'：'+spot.caption);button.innerHTML='<span class="bloom" aria-hidden="true"></span>';button.addEventListener('click',event=>openTheme(event,spot,button));stage.appendChild(button)});
let introClosing=false,started=false;
function syncMusicButton(){const playing=!bgm.paused;mute.setAttribute('aria-pressed',String(playing));mute.setAttribute('aria-label',playing?'暂停背景音乐':'播放背景音乐');mute.querySelector('span').textContent=playing?'静':'乐'}
function closeIntro(skipped=false){if(introClosing||!opening.isConnected)return;introClosing=true;if(skipped){document.body.classList.add('skip-intro');opening.remove();mute.hidden=false;return}opening.classList.add('fading');opening.addEventListener('transitionend',event=>{if(event.propertyName==='opacity'){opening.remove();mute.hidden=false}},{once:true});window.setTimeout(()=>{opening.remove();mute.hidden=false},3200)}
function startExperience(){if(started)return;started=true;entry.remove();opening.muted=true;opening.volume=0;bgm.volume=.25;bgm.play().then(syncMusicButton).catch(syncMusicButton);if(!opening.isConnected||window.matchMedia('(prefers-reduced-motion: reduce)').matches){closeIntro(true);return}document.body.classList.add('intro-started');opening.classList.add('playing');opening.playbackRate=.75;opening.play().catch(()=>closeIntro(true))}
document.getElementById('enter').addEventListener('click',startExperience);
opening.addEventListener('timeupdate',()=>{if(opening.currentTime>=3)closeIntro()});
opening.addEventListener('ended',()=>closeIntro());
opening.addEventListener('error',()=>{if(started)closeIntro(true)});
mute.addEventListener('click',()=>{if(bgm.paused)bgm.play().then(syncMusicButton).catch(syncMusicButton);else{bgm.pause();syncMusicButton()}});
// 对外发布如需改用备选曲，将 bgm 的 src 换为 assets/bgm/bgm-liushui.mp3。
function setPhoto(index){photoIndex=index;const item=activeSpot.photos[index];themePhoto.src=item.src;themePhoto.alt=item.alt;prev.disabled=index===0;next.disabled=index===activeSpot.photos.length-1;controls.hidden=activeSpot.photos.length<2}
function inkAt(x,y,startScale){veil.style.transition='none';veil.style.left=x+'px';veil.style.top=y+'px';veil.style.opacity='1';veil.style.transform=`translate(-50%,-50%) scale(${startScale})`;void veil.offsetWidth}
function openTheme(event,spot,button){if(busy||theme.classList.contains('show'))return;busy=true;activeSpot=spot;activeButton=button;const art=String(SPOTS.indexOf(spot)+1).padStart(2,'0');theme.style.setProperty('--theme-art',`url("style/ink/chapter-${art}-sparse.png")`);setPhoto(0);caption.textContent=spot.caption;const rect=button.getBoundingClientRect();inkAt(rect.left+rect.width/2,rect.top+rect.height/2,0);veil.style.transition='transform 1.2s var(--slow)';veil.style.transform='translate(-50%,-50%) scale(300)';window.setTimeout(()=>{theme.classList.add('show');theme.setAttribute('aria-hidden','false');veil.style.transition='opacity .8s var(--slow)';veil.style.opacity='0'},1200);window.setTimeout(()=>{busy=false;back.focus()},2200)}
function closeTheme(){if(busy||!theme.classList.contains('show'))return;busy=true;window.clearTimeout(switchTimer);photoSwitching=false;themePhoto.classList.remove('switching');themePhoto.style.removeProperty('transition');const rect=activeButton.getBoundingClientRect();inkAt(rect.left+rect.width/2,rect.top+rect.height/2,300);theme.classList.remove('show');theme.setAttribute('aria-hidden','true');veil.style.transition='transform 1.2s var(--slow)';veil.style.transform='translate(-50%,-50%) scale(0)';window.setTimeout(()=>{veil.style.opacity='0';themePhoto.removeAttribute('src');busy=false;activeButton.focus()},1200)}
function switchPhoto(delta){if(!activeSpot||busy||photoSwitching)return;const target=photoIndex+delta;if(target<0||target>=activeSpot.photos.length)return;photoSwitching=true;const preview=new Image();preview.src=activeSpot.photos[target].src;preview.decode().then(()=>{if(!theme.classList.contains('show')){photoSwitching=false;return}themePhoto.style.transition='opacity .48s var(--slow)';themePhoto.classList.add('switching');switchTimer=window.setTimeout(()=>{setPhoto(target);requestAnimationFrame(()=>{themePhoto.classList.remove('switching');switchTimer=window.setTimeout(()=>{themePhoto.style.removeProperty('transition');photoSwitching=false},480)})},480)}).catch(()=>{photoSwitching=false})}
prev.addEventListener('click',()=>switchPhoto(-1));next.addEventListener('click',()=>switchPhoto(1));back.addEventListener('click',closeTheme);
document.addEventListener('keydown',event=>{if(!theme.classList.contains('show'))return;if(event.key==='Escape')closeTheme();if(event.key==='ArrowLeft')switchPhoto(-1);if(event.key==='ArrowRight')switchPhoto(1)});
</script>
</body>
</html>
